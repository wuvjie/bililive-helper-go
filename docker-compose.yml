services:
  bililive-helper-go:
    build: .
    image: bililive-helper-go
    container_name: bililive-helper-go
    ports:
      # 宿主机端口:容器端口，默认访问 http://IP:5689
      - "${PORT:-5689}:5000"
    volumes:
      # 录像存储目录（即 bililive-go 录制输出目录挂载至容器 /recordings）
      - ${RECORDINGS_DIR:-./recordings}:/recordings
      # 配置文件、日志、历史记录持久化目录挂载至容器 /data
      - ${DATA_DIR:-./data}:/data
    environment:
      # 录制视频根目录（容器内固定路径）
      - TARGET_DIR=/recordings
      # 日志和配置文件存储目录（容器内固定路径）
      - LOG_DIR=/data
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
      # --- 以下为可选配置，取消注释或在 .env 中设置即可生效 ---
      # 登录密码（不设则首次启动时通过网页初始化向导设置）
      # - PASSWORD=${PASSWORD:-}
      # 使用 HTTPS 反向代理时设为 true
      # - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # 任务完成通知（支持 Bark/Slack/飞书等兼容 Webhook）
      # - WEBHOOK_URL=${WEBHOOK_URL:-}
      # API Token（用于外部程序通过 Bearer 认证调用接口）
      # - API_TOKEN=${API_TOKEN:-}
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    # 资源限制（防止占用过多系统资源影响录制）
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-3.0}'    # CPU 上限（建议留 1 核给录制进程）
          memory: ${MEM_LIMIT:-4G}     # 内存上限（建议留一半给录制进程）
    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 自定义网络（若需与同一主机上的 bililive-go 容器通信，可解开注释加入已有网络）
    # networks:
    #   - nas

# networks:
#   nas:
#     external: true
